name: Deploy to GitHub Pages

# Pages source is "GitHub Actions" (Settings → Pages), so this workflow is the deploy (ADR 0080, 0083).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test tests
      # Only runtime files, with ?v=<commit> on every local URL so no phone mixes old and new files (ADR 0080).
      - run: bun tools/stamp-version.mjs --bundle _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
