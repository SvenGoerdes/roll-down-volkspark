name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned staging dependencies
        working-directory: staging
        run: bun install --frozen-lockfile
      - run: bun test tests staging/tests
      - run: bun tools/build-staging.js
